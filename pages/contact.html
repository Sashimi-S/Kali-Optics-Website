<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../CSS/base.css">
    <link rel="stylesheet" href="../CSS/components.css">
    <link rel="stylesheet" href="../CSS/contact.css">

    <script src="../JS/scrollbar.js" defer></script>
</head>



<body>
    <nav id="navbar-container"></nav>
    <script src="../JS/navbar.js"></script>
    
    <div class = "contact-container">
    <h1>Contact Us</h1>
    <form> 
         <div class="form-group"><input type="text"  name="first-name" placeholder="First Name"></div>

        <div class="form-group"><input type="text"  name="last-name" placeholder="Last Name" required> </div>
        
        <div class="form-group"><input type="email"  name="email" placeholder="Email" required></div>
        
        <div class="form-group"><textarea  name="message" rows="6" placeholder="Message" required></textarea></div>
        
        <button type="submit" class="btn-send">Send Message</button>
    </form>

</div>




</body>
</html>
